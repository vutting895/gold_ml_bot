name: Auto Retrain Gold ML Model

on:
  schedule:
    # ตั้งเวลารันทุกวันอาทิตย์ เวลา 18:00 UTC (01:00 น. เช้าวันจันทร์ไทย ก่อนตลาดเปิด)
    - cron: '0 18 * * 0'
  workflow_dispatch: # ปุ่มกดสั่งเทรนด้วยตัวเอง

jobs:
  retrain:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Run Model Training
        run: |
          python train_gold_model.py

      - name: 5. Commit & Push Updated Model File
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add gold_ml_filter.pkl
          git commit -m "🤖 Auto-retrained ML model with latest market data [skip ci]" || exit 0
          git push
          
