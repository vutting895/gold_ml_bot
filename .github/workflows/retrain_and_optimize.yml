name: Retrain Model & Auto-Optimize Config

on:
  schedule:
    # รันทุกวันอาทิตย์ เวลา 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Model Retraining
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python train_gold_model.py

      - name: Run Auto Backtest Optimizer
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python auto_backtest_optimizer.py

      - name: Commit and Push Updated Model
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add gold_ml_filter.pkl config.json || true
          git commit -m "🤖 Auto-retrained ML Model & Optimized Config [skip ci]" || exit 0
          git push
          
