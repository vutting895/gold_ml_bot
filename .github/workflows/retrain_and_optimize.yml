name: Retrain Model & Auto-Optimize Config

on:
  schedule:
    - cron: '0 0 * * 0'   # ⏰ รันทุกวันอาทิตย์ เวลา 00:00 UTC (ช่วงตลาดปิด)
  workflow_dispatch:      # 🔘 ปุ่มกดรันมือบน GitHub

jobs:
  retrain_and_optimize:
    name: Retrain ML & Optimize Config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance joblib requests

      - name: 1. Run ML Model Training
        run: |
          python train_gold_model.py

      - name: 2. Run Auto Backtest Optimization
        run: |
          python auto_backtest_optimizer.py

      - name: 3. Commit & Push Updated Model and Config
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add gold_ml_filter.pkl best_config.json
          git commit -m "🤖 Auto-retrained ML model & updated best_config.json [skip ci]" || exit 0
          git push
          git push
