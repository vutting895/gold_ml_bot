name: Retrain and Optimize ML Model

on:
  schedule:
    # รันอัตโนมัติทุกวันอาทิตย์ เวลา 07:00 น. (เวลาไทย)
    - cron: '0 0 * * 0'
  workflow_dispatch: # อนุญาตให้กดสั่งรันด้วยมือผ่านหน้าเว็บ GitHub ได้

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Retrain & Optimization Script
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          GOOGLE_SHEET_NAME: ${{ secrets.GOOGLE_SHEET_NAME }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python retrain_and_optimize.py

      - name: Commit and Push updated model
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gold_ml_filter.pkl
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-retrain ML model [skip ci]" && git push)
          
