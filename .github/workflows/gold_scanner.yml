name: Gold Real-time M5 Scanner

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ดึงไฟล์ last_signal.json จาก Cache ของรอบที่แล้ว (ถ้ามี)
      - name: Restore Last Signal Cache
        uses: actions/cache/restore@v4
        with:
          path: last_signal.json
          key: last-signal-state-${{ runner.os }}
          restore-keys: |
            last-signal-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy yfinance joblib scikit-learn

      - name: Run Gold Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: python scanner.py

      # บันทึกไฟล์ last_signal.json ลง Cache สำหรับรอบถัดไป
      - name: Save Last Signal Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: last_signal.json
          key: last-signal-state-${{ runner.os }}-${{ github.run_id }}
          
