name: Run Gold M5 Scanner

on:
  schedule:
    # ⏰ ตั้งเวลารันทุกๆ 5 นาที
    - cron: '*/5 * * * *'
  
  # 🔘 รองรับการกดรันด้วยตนเอง (Manual Run)
  workflow_dispatch:

jobs:
  scan_market:
    name: Execute Gold Signal Scanner
    runs-on: ubuntu-latest

    steps:
      # 1. ดึงโค้ดทั้งหมดจาก Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. ติดตั้ง Python 3.10
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # 3. ติดตั้ง Dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance joblib requests

      # 4. รันสคริปต์สแกนราคา พร้อมส่ง Secrets
      - name: Run Scanner Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scanner.py
